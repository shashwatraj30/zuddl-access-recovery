<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifying access...</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="mark">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="10" width="18" height="11" rx="2" stroke="#8b95a5" stroke-width="1.6"/>
      <path d="M7 10V7a5 5 0 0110 0v3" stroke="#8b95a5" stroke-width="1.6"/>
    </svg>
    Event Summit 2026 &middot; Attendee Access
  </div>

  <div class="steps">
    <div class="step done"></div>
    <div class="step done"></div>
    <div class="step active"></div>
  </div>

  <h1 id="heading">Verifying your link&hellip;</h1>
  <p class="sub" id="subtext">One moment while we check this.</p>

  <div class="card" id="result"></div>

  <a class="back-link" href="index.html">&larr; Back to sign in</a>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const heading = document.getElementById('heading');
const subtext = document.getElementById('subtext');
const result = document.getElementById('result');

const MESSAGES = {
  ok: null, // handled specially below
  invalid: {
    title: "This link isn't valid",
    body: "It may have been copied incorrectly. Request a new one from the recovery page.",
  },
  expired: {
    title: 'This link has expired',
    body: 'Access links are valid for 20 minutes. Request a fresh one and use it right away.',
  },
  already_used: {
    title: 'This link was already used',
    body: "Each link works once. If you didn't use it, request a new one — the old one is now inactive either way.",
  },
};

async function verify() {
  if (!token) {
    renderFailure('invalid');
    return;
  }

  try {
    const res = await fetch('/api/verify?token=' + encodeURIComponent(token));
    const data = await res.json();

    if (data.result === 'ok') {
      renderSuccess(data.attendee);
    } else {
      renderFailure(data.result);
    }
  } catch (err) {
    renderFailure('invalid');
  }
}

function renderSuccess(attendee) {
  heading.textContent = "You're in";
  subtext.textContent = 'This link has now been deactivated — it can\'t be used again.';
  result.innerHTML = `
    <div class="status show ok" style="margin-top:0;">
      Welcome, ${attendee.name}. You're signed in as ${attendee.email}.
    </div>
  `;
}

function renderFailure(reason) {
  const msg = MESSAGES[reason] || MESSAGES.invalid;
  heading.textContent = msg.title;
  subtext.textContent = msg.body;
  result.innerHTML = `
    <button onclick="location.href='recover.html'">Request a new link</button>
  `;
}

verify();
</script>
</body>
</html>
