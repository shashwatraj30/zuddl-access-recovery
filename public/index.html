<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Event Summit 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="mark">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="10" width="18" height="11" rx="2" stroke="#8b95a5" stroke-width="1.6"/>
      <path d="M7 10V7a5 5 0 0110 0v3" stroke="#8b95a5" stroke-width="1.6"/>
    </svg>
    Event Summit 2026 &middot; Attendee Access
  </div>

  <h1>Check your inbox</h1>
  <p class="sub">We emailed you a one-time link when you registered. Use it to enter the event &mdash; no password needed.</p>

  <div class="card">
    <label>Registered email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" value="priya.sharma@example.com">
    <button disabled>Waiting for your link&hellip;</button>
    <p class="note">This demo simulates what happens when that link never shows up.</p>
  </div>

  <p style="margin-top:22px;">
    <button class="link-btn" onclick="location.href='recover.html'">Can't find your access link?</button>
  </p>
</div>
</body>
</html>
