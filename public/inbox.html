<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Inbox</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="mark">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M3 6l9 6 9-6M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z" stroke="#8b95a5" stroke-width="1.6"/>
    </svg>
    Mock Inbox &middot; demo only, no real email sent
  </div>

  <h1>Simulated inbox</h1>
  <p class="sub">In production this would be a real email. Here you can see exactly what got "sent."</p>

  <div class="card">
    <label>Check inbox for</label>
    <input type="email" id="email" value="priya.sharma@example.com">
    <button onclick="loadInbox()">Refresh inbox</button>
  </div>

  <div id="messages"></div>

  <a class="back-link" href="recover.html">&larr; Back to recovery form</a>
</div>

<script>
async function loadInbox() {
  const email = document.getElementById('email').value.trim();
  const res = await fetch('/api/mock-inbox/' + encodeURIComponent(email));
  const data = await res.json();
  const container = document.getElementById('messages');

  if (!data.messages || data.messages.length === 0) {
    container.innerHTML = '<div class="empty">No messages yet. Request a recovery link first.</div>';
    return;
  }

  container.innerHTML = data.messages
    .slice()
    .reverse()
    .map(m => `
      <div class="inbox-msg">
        <div class="subject">${m.subject}</div>
        <div class="time">${new Date(m.sentAt).toLocaleString()}</div>
        <a href="${m.link}">${m.link}</a>
      </div>
    `)
    .join('');
}

loadInbox();
</script>
</body>
</html>
